[package]
name = "plica"
version = "0.5.5"
edition = "2024"
description = "A mouse-friendly terminal text editor"
license = "MIT"
repository = "https://github.com/subbaan/plica"
rust-version = "1.88"

[dependencies]
anyhow = "1"
base64 = "0.22"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
notify = "8"
ratatui = "0.30"
ropey = "1"
signal-hook = "0.3"
tempfile = "3"
toml = "1"
toml_edit = "0"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
