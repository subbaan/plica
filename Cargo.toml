[package]
name = "plica"
version = "0.5.10"
edition = "2024"
description = "A mouse-friendly terminal text editor"
license = "MIT"
repository = "https://github.com/subbaan/plica"
rust-version = "1.88"

[dependencies]
anyhow = "1"
base64 = "0.22"
chardetng = "1.0.0"
# Only to turn on use-dev-tty (same crossterm as ratatui): its event loop gives
# up on a closed terminal, where the default one re-reads it forever.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
encoding_rs = "0.8.42"
notify = "8"
ratatui = "0.30"
ropey = "1"
rustix = { version = "1", features = ["event", "stdio", "termios"] }
signal-hook = "0.3"
# Syntax colouring: pure-Rust regexes (fancy-regex), so the static musl
# build needs no C toolchain; grammars from two-face (bat's set).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
tempfile = "3"
toml = "1"
toml_edit = "0"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
